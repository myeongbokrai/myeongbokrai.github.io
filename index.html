<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hong Myung Bo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      background: #000;
      color: #c89a36;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      padding: 70px 22px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .share-button {
      position: fixed;
      top: 22px;
      right: 22px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid rgba(200, 154, 54, 0.35);
      background: rgba(0, 0, 0, 0.7);
      color: #c89a36;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease;
    }

    .share-button:hover {
      transform: scale(1.06);
      background: rgba(200, 154, 54, 0.08);
    }

    .share-button svg {
      width: 21px;
      height: 21px;
    }

    .profile-image {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(200, 154, 54, 0.5);
      margin-top: 20px;
      margin-bottom: 20px;
    }

    .profile-name {
      font-size: 27px;
      font-weight: 600;
      letter-spacing: .2px;
      color: #c89a36;
      margin-bottom: 7px;
    }

    .profile-id {
      font-size: 14px;
      color: rgba(200, 154, 54, 0.65);
      margin-bottom: 22px;
    }

    .socials {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      margin-bottom: 42px;
    }

    .social {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c89a36;
      text-decoration: none;
      transition: transform .2s ease, opacity .2s ease;
    }

    .social:hover {
      transform: scale(1.1);
      opacity: .75;
    }

    .social svg {
      width: 29px;
      height: 29px;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-button {
      width: 100%;
      min-height: 67px;
      border-radius: 40px;
      border: 1px solid rgba(200, 154, 54, 0.35);
      color: #c89a36;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 15px 60px;
      font-size: 16px;
      font-weight: 500;
      text-align: center;
      background: #000;
      transition: background .2s ease, border-color .2s ease, transform .15s ease;
    }

    .link-button:hover {
      background: rgba(200, 154, 54, 0.07);
      border-color: rgba(200, 154, 54, 0.75);
      transform: translateY(-1px);
    }

    .link-button:active {
      transform: scale(.985);
    }

    .button-icon {
      position: absolute;
      left: 25px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .button-icon svg {
      width: 22px;
      height: 22px;
    }

    .footer {
      margin-top: auto;
      padding-top: 80px;
      font-size: 11px;
      color: rgba(200, 154, 54, 0.35);
      text-align: center;
    }

    @media (max-width: 600px) {
      .page {
        padding: 65px 18px 40px;
      }

      .profile-image {
        width: 96px;
        height: 96px;
      }

      .profile-name {
        font-size: 24px;
      }

      .link-button {
        min-height: 64px;
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <button class="share-button" onclick="sharePage()" aria-label="페이지 공유">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <path d="M12 3v12"></path>
        <path d="M8 7l4-4 4 4"></path>
        <path d="M5 11v8h14v-8"></path>
      </svg>
    </button>

    <!-- 저장소에 profile.jpg 파일을 같이 올리면 표시됨 -->
    <img src="profile.jpg" alt="Hong Myung Bo" class="profile-image">

    <div class="profile-name">Hong Myung Bo</div>
    <div class="profile-id">@myeongbokr_ai</div>

    <div class="socials">
      <!-- X -->
      <a class="social" href="https://x.com/myeongbokr_ai" target="_blank" rel="noopener noreferrer" aria-label="X">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M18.244 2H21l-6.56 7.497L22.16 22h-6.045l-4.735-6.19L5.96 22H3.2l6.934-7.926L2.72 2h6.2l4.28 5.66L18.244 2Zm-.967 17.8h1.527L8.09 4.084H6.45L17.277 19.8Z"/>
        </svg>
      </a>

      <!-- Instagram -->
      <a class="social" href="https://www.instagram.com/myeongbokr_ai/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle>
        </svg>
      </a>

      <!-- Patreon -->
      <a class="social" href="https://www.patreon.com/myeongbokr_ai" target="_blank" rel="noopener noreferrer" aria-label="Patreon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="15" cy="8" r="6"></circle>
          <rect x="3" y="2" width="3" height="20"></rect>
        </svg>
      </a>
    </div>

    <div class="links">

      <a class="link-button" href="https://www.patreon.com/myeongbokr_ai" target="_blank" rel="noopener noreferrer">
        <span class="button-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <circle cx="15" cy="8" r="6"></circle>
            <rect x="3" y="2" width="3" height="20"></rect>
          </svg>
        </span>
        Patreon
      </a>

      <a class="link-button" href="https://www.instagram.com/myeongbokr_ai/" target="_blank" rel="noopener noreferrer">
        <span class="button-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle>
          </svg>
        </span>
        Instagram
      </a>

      <a class="link-button" href="https://x.com/myeongbokr_ai" target="_blank" rel="noopener noreferrer">
        <span class="button-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.244 2H21l-6.56 7.497L22.16 22h-6.045l-4.735-6.19L5.96 22H3.2l6.934-7.926L2.72 2h6.2l4.28 5.66L18.244 2Zm-.967 17.8h1.527L8.09 4.084H6.45L17.277 19.8Z"/>
          </svg>
        </span>
        X / Twitter
      </a>

    </div>

    <div class="footer">HONG MYUNG BO</div>
  </main>

  <script>
    async function sharePage() {
      const shareData = {
        title: "Hong Myung Bo",
        url: window.location.href
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
        } catch (error) {
          // 사용자가 공유창을 닫은 경우에는 아무것도 하지 않음
        }
        return;
      }

      try {
        await navigator.clipboard.writeText(window.location.href);
        alert("주소를 복사했어.");
      } catch (error) {
        alert(window.location.href);
      }
    }
  </script>
</body>
</html>
